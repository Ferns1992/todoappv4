<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #22c55e;
      --shadow: 0 10px 40px -10px rgba(0,0,0,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
    }
    .app-container { 
      width: 100%; 
      max-width: 440px; 
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card { 
      background: var(--card); 
      border-radius: 24px; 
      box-shadow: var(--shadow); 
      padding: 32px; 
      overflow: hidden;
    }
    .logo { 
      text-align: center; 
      margin-bottom: 32px; 
    }
    .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .logo-icon svg { width: 28px; height: 28px; fill: white; }
    h1 { text-align: center; margin-bottom: 8px; font-size: 24px; font-weight: 700; color: var(--text); }
    .subtitle { text-align: center; color: var(--text-secondary); font-size: 14px; }
    
    .input-group { display: flex; gap: 10px; margin-bottom: 16px; }
    input { 
      flex: 1; 
      padding: 14px 18px; 
      border: 2px solid var(--border); 
      border-radius: 12px; 
      font-size: 15px; 
      outline: none; 
      transition: all 0.2s;
      font-family: inherit;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
    
    .add-btn { 
      padding: 14px 24px; 
      background: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 15px; 
      font-weight: 600; 
      transition: all 0.2s;
      font-family: inherit;
    }
    .add-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
    
    ul { list-style: none; margin-top: 24px; }
    li { 
      display: flex; 
      align-items: center; 
      padding: 16px; 
      background: var(--bg);
      border-radius: 12px; 
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    li:hover { transform: translateX(4px); }
    li.completed { opacity: 0.6; }
    li.completed .todo-text { text-decoration: line-through; color: var(--text-secondary); }
    
    .checkbox { 
      width: 22px; 
      height: 22px; 
      margin-right: 14px; 
      cursor: pointer; 
      accent-color: var(--primary); 
    }
    .todo-text { flex: 1; font-size: 15px; font-weight: 500; }
    
    .delete-btn { 
      background: transparent; 
      color: var(--danger); 
      padding: 8px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      opacity: 0;
      transition: all 0.2s;
    }
    li:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: rgba(239, 68, 68, 0.1); }
    
    .empty { 
      text-align: center; 
      color: var(--text-secondary); 
      padding: 40px 20px; 
      font-size: 14px; 
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

    .locked-screen {
      text-align: center;
      padding: 40px 20px;
    }
    .locked-icon {
      width: 64px;
      height: 64px;
      background: var(--bg);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .locked-icon svg { width: 32px; height: 32px; fill: var(--text-secondary); }
    .locked-screen h2 { font-size: 20px; margin-bottom: 8px; }
    .locked-screen p { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
    .login-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .login-btn:hover { background: var(--primary-dark); }

    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 12px;
      margin-bottom: 20px;
      color: white;
    }
    .user-bar span { font-size: 14px; font-weight: 500; }
    .logout-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.3); }

    .modal { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      justify-content: center; 
      align-items: center; 
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal.show { display: flex; }
    .modal-content { 
      background: white; 
      padding: 32px; 
      border-radius: 24px; 
      width: 90%; 
      max-width: 360px;
      animation: scaleIn 0.3s;
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal h2 { margin-bottom: 24px; font-size: 20px; text-align: center; }
    .modal input { width: 100%; margin-bottom: 16px; }
    .modal-buttons { display: flex; gap: 12px; }
    .modal-buttons button { flex: 1; }
    .cancel-btn { background: var(--bg); color: var(--text); }
    .cancel-btn:hover { background: var(--border); }
    
    .app-content { display: none; }
    .app-content.show { display: block; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <h1>My Tasks</h1>
        <p class="subtitle">Stay organized and productive</p>
      </div>

      <div class="locked-screen" id="lockedScreen">
        <div class="locked-icon">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
        <h2>Tasks Locked</h2>
        <p>Please login to view and manage your tasks</p>
        <button class="login-btn" onclick="showLoginModal()">Login to Continue</button>
      </div>

      <div class="app-content" id="appContent">
        <div class="user-bar">
          <span>Welcome, Admin!</span>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        
        <div class="input-group">
          <input type="text" id="todoInput" placeholder="Add a new task...">
          <button class="add-btn" onclick="addTodo()">Add</button>
        </div>
        
        <ul id="todoList"></ul>
      </div>
    </div>
  </div>

  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h2>Welcome Back</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <div class="modal-buttons">
        <button class="cancel-btn" onclick="hideLoginModal()">Cancel</button>
        <button class="add-btn" onclick="login()">Login</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3060/api/todos';
    let isAdmin = false;

    function showLoginModal() { 
      document.getElementById('loginModal').classList.add('show'); 
    }
    
    function hideLoginModal() { 
      document.getElementById('loginModal').classList.remove('show');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }

    function login() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      if (user === 'admin' && pass === 'admin') {
        isAdmin = true;
        localStorage.setItem('todoAdmin', 'true');
        showApp();
        hideLoginModal();
      } else {
        alert('Invalid credentials');
      }
    }

    function logout() {
      isAdmin = false;
      localStorage.removeItem('todoAdmin');
      showLocked();
    }

    function showApp() {
      document.getElementById('lockedScreen').style.display = 'none';
      document.getElementById('appContent').classList.add('show');
      loadTodos();
    }

    function showLocked() {
      document.getElementById('appContent').classList.remove('show');
      document.getElementById('lockedScreen').style.display = 'block';
      document.getElementById('todoList').innerHTML = '';
    }

    async function loadTodos() {
      const res = await fetch(API_URL);
      const todos = await res.json();
      const list = document.getElementById('todoList');
      if (todos.length === 0) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">📝</div>No tasks yet. Add one above!</div>';
        return;
      }
      list.innerHTML = todos.map(todo => `
        <li class="${todo.completed ? 'completed' : ''}">
          <input type="checkbox" class="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${todo.id}, this.checked)">
          <span class="todo-text">${todo.text}</span>
          <button class="delete-btn" onclick="deleteTodo(${todo.id})">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </button>
        </li>
      `).join('');
    }

    async function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      input.value = '';
      loadTodos();
    }

    async function toggleTodo(id, completed) {
      await fetch(`${API_URL}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      loadTodos();
    }

    async function deleteTodo(id) {
      await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
      loadTodos();
    }

    document.getElementById('todoInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    document.getElementById('loginModal').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });

    if (localStorage.getItem('todoAdmin') === 'true') {
      isAdmin = true;
      showApp();
    } else {
      showLocked();
    }
  </script>
</body>
</html>
